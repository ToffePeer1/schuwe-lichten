; ESP32 DMX controller - see README.md for the hardware and docs/ for the protocol and safety rules.
;
; Version pins (do not bump without re-checking esp_dmx compatibility):
;   platform espressif32@7.1.3 -> Arduino core 2.0.17 (ESP-IDF 4.4).
;   espressif32@8.x moves to Arduino core 3.3 / IDF 5.5, which esp_dmx 4.1.0
;   does not compile against (someweisguy/esp_dmx issue #181).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles =
    src/web/index.html
    src/web/admin.html
    src/web/patterns.json
; Presets/shows live on LittleFS. NEVER run "upload filesystem": it wipes them.
board_build.filesystem = littlefs
lib_deps =
    someweisguy/esp_dmx@4.1.0
    links2004/WebSockets@2.7.3
extra_scripts = pre:tools/patch_websockets.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8
build_src_flags = -Wall -Wextra

; Host unit tests for lib/laser_core (needs a host g++): uv run pio test -e native
; Without g++ use: bash tools/run_host_tests.sh
[env:native]
platform = native
build_flags = -std=c++17
