; ESP32 DMX controller - see CLAUDE.md for hardware, safety rules and stages.
;
; Version pins (do not bump without re-checking esp_dmx compatibility):
;   platform espressif32@7.1.3 -> Arduino core 2.0.17 (ESP-IDF 4.4).
;   espressif32@8.x moves to Arduino core 3.3 / IDF 5.5, which esp_dmx 4.1.0
;   does not compile against (someweisguy/esp_dmx issue #181).

[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = src/web/index.html
lib_deps =
    someweisguy/esp_dmx@4.1.0
    links2004/WebSockets@2.7.3
build_src_flags = -Wall -Wextra

; Normal firmware: CH7 clamp enforced.
[env:esp32dev]
extends = esp32_common

; STAGE 1 LIMIT TEST ONLY: the CH7 clamp is disabled so the vertical limit can
; be found. Aim the laser at a wall away from people. Never use this build for
; anything else. Build/flash with: uv run pio run -e findlimit -t upload
[env:findlimit]
extends = esp32_common
build_flags = -DLASER_CH7_CLAMP_DISABLED=1

; Host unit tests for lib/laser_core (needs a host g++): uv run pio test -e native
[env:native]
platform = native
build_flags = -std=c++17
